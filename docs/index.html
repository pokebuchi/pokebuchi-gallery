<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pokebuchi Gallery｜ポケぶち 作品ギャラリー</title>
<meta name="description" content="ポケカを額縁アートに再構築。ポケぶちのディスプレイフレーム作品ギャラリーです。">

<meta property="og:type" content="website">
<meta property="og:title" content="Pokebuchi Gallery｜ポケぶち 作品ギャラリー">
<meta property="og:description" content="ポケカを額縁アートに再構築。ポケぶちのディスプレイフレーム作品ギャラリーです。">
<meta property="og:image" content="ogp.jpg">
<meta name="twitter:card" content="summary_large_image">

<link rel="icon" href="favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#ffffff">

<link rel="stylesheet" href="assets/css/style.css?v=14">
</head>
<body>

<header class="site-header">
  <h1 class="logo">
    <img src="assets/img/logo.png"
         srcset="assets/img/logo.png 1x, assets/img/logo@2x.png 2x"
         width="560" height="557" alt="ポケぶち">
  </h1>
  <p class="tagline">ポケカを額縁アートに再構築</p>
  <nav class="social" aria-label="SNS">
    <a href="https://x.com/poke_buchi" target="_blank" rel="noopener" aria-label="X">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M18.9 2H22l-7.1 8.1L23.2 22h-6.5l-5.1-6.7L5.8 22H2.7l7.6-8.7L1.2 2h6.7l4.6 6.1L18.9 2Zm-1.1 18h1.7L7.3 3.8H5.5L17.8 20Z"/></svg>
    </a>
  </nav>
</header>

<div class="controls">
  <div class="search-wrap">
    <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" d="M10.5 18a7.5 7.5 0 1 0 0-15 7.5 7.5 0 0 0 0 15Zm5.5-2 5 5"/></svg>
    <input type="search" id="search" placeholder="カード名で探す" autocomplete="off" aria-label="カード名で探す">
  </div>

  <div class="pack-filter" id="pack-filter">
    <button type="button" class="cat-toggle" id="cat-toggle"
            aria-expanded="false" aria-controls="cat-panel">
      <span>カテゴリ</span>
      <span class="cat-current" id="cat-current"></span>
      <span class="chev">&#9660;</span>
    </button>

    <div class="cat-panel" id="cat-panel">
      <button type="button" class="pack-all is-active" data-pack="">すべて</button>
      <div id="series-list"></div>
    </div>
  </div>
</div>

<main>
  <p class="result-count" id="result-count"></p>
  <div class="grid" id="grid"></div>
  <div id="sentinel" aria-hidden="true"></div>
  <p class="empty" id="empty" hidden>該当する作品がありません。</p>
</main>

<footer class="site-footer">
  <a class="shop-link" href="https://pokebuchi.base.shop/" target="_blank" rel="noopener">ショップへ移動</a>
  <p class="copyright">© Pokebuchi</p>
</footer>

<div class="lightbox" id="lightbox" hidden>
  <button type="button" class="lb-close" id="lb-close" aria-label="閉じる">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
      <path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M5 5l14 14M19 5L5 19"/>
    </svg>
  </button>

  <figure class="lb-figure">
    <img id="lb-img" alt="">
    <figcaption class="lb-caption">
      <div class="lb-row">
        <button type="button" class="lb-nav lb-prev" id="lb-prev" aria-label="前の作品">
          <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true">
            <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M15 4L7 12l8 8"/>
          </svg>
        </button>
        <div class="lb-text">
          <h2 id="lb-name"></h2>
          <p id="lb-pack"></p>
        </div>
        <button type="button" class="lb-nav lb-next" id="lb-next" aria-label="次の作品">
          <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true">
            <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M9 4l8 8-8 8"/>
          </svg>
        </button>
      </div>
      <a id="lb-url" class="lb-shop" href="#" target="_blank" rel="noopener">ショップへ移動</a>
      <p class="lb-hint" id="lb-hint"></p>
    </figcaption>
  </figure>
</div>

<script src="assets/js/app.js?v=14"></script>
</body>
</html>
